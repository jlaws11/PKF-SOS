name: Build PKF-SOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'pkf-sos-port.zip'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add the port files
        run: |
          test -f pkf-sos-port.zip || { echo "pkf-sos-port.zip is missing"; exit 1; }
          unzip -o pkf-sos-port.zip -d .

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish for Linux
        run: dotnet publish src/PKForge.Linux/PKForge.Linux.csproj -c Release -r linux-x64 --self-contained true -o publish

      - name: Build the AppImage
        run: bash packaging/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: PKF-SOS-x86_64.AppImage

  windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add the port files
        run: |
          test -f pkf-sos-port.zip || { echo "pkf-sos-port.zip is missing"; exit 1; }
          unzip -o pkf-sos-port.zip -d .

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish for Windows
        run: dotnet publish src/PKForge.Linux/PKForge.Linux.csproj -c Release -r win-x64 --self-contained true -o publish-win

      - name: Make the zip
        run: |
          mkdir PKF-SOS
          cp -r publish-win/. PKF-SOS/
          mv PKF-SOS/PKForge.exe PKF-SOS/PKF-SOS.exe
          printf 'PKF-SOS for Windows\r\n\r\n1. Unzip this whole folder anywhere.\r\n2. Double-click PKF-SOS.exe.\r\n3. Open Settings, then Folders, and add the folder that holds your saves.\r\n\r\nClose your emulator before editing a save. Windows may warn that the app is unrecognised because it is not signed: choose More info, then Run anyway.\r\nUnofficial and AI built. Not affiliated with PKForge. Keep backups of your saves.\r\n' > PKF-SOS/README.txt
          zip -qr PKF-SOS-windows-x64.zip PKF-SOS

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: PKF-SOS-windows-x64.zip

  release:
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true

      - name: Show what is being published
        run: ls -l downloads

      - name: Publish one release with both downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PKF-SOS build ${{ github.run_number }}
          prerelease: false
          files: |
            downloads/PKF-SOS-x86_64.AppImage
            downloads/PKF-SOS-windows-x64.zip
