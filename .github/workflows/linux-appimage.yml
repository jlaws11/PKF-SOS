name: Linux AppImage

on:
  workflow_dispatch:
  push:
    paths:
      - 'linux-port.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add the Linux port files
        run: |
          test -f linux-port.zip || { echo "linux-port.zip is missing"; exit 1; }
          unzip -o linux-port.zip -d .

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish src/PKForge.Linux/PKForge.Linux.csproj -c Release -r linux-x64 --self-contained true -o publish

      - name: Build the AppImage
        run: bash packaging/build-appimage.sh

      - name: Publish a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-build-${{ github.run_number }}
          name: Linux build ${{ github.run_number }}
          prerelease: true
          files: PKF-SOS-x86_64.AppImage
